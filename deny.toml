# Dependency policy checked by `cargo deny check licenses bans sources`.

[graph]
all-features = true

[licenses]
# Licenses compatible with distributing this crate under Apache-2.0.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
