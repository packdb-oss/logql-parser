name: oss-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oss-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: private-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify exact revision and build candidate
        env:
          OSS_CHECK_SCOPE: full
          OSS_SOURCE_SHA: ${{ github.sha }}
        run: |
          test -x scripts/oss-ci.sh
          scripts/oss-ci.sh candidate
          test -s dist/release-record.json
      - name: Enforce bounded Actions artifact size
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          total = sum(p.stat().st_size for p in Path("dist").rglob("*") if p.is_file())
          if total > 100 * 1024 * 1024:
              raise SystemExit("Candidate exceeds 100 MiB: use reviewed release asset storage")
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
